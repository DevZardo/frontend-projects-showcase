<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pagamento.css">
    <title>Pagamento via PIX | Doce Encanto</title>
</head>
<body>
    <main>
        <a class="brand" href="index.html">Doce Encanto</a>
        <section class="payment-card">
            <p class="eyebrow">PAGAMENTO INSTANTÂNEO</p>
            <h1>Pague com PIX</h1>
            <p class="lead">Escaneie o QR Code pelo aplicativo do seu banco ou copie o código PIX.</p>
            <div class="pix-layout">
                <img class="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=00020126580014BR.GOV.BCB.PIX0136doce.encanto%40exemplo.com520400005303986540510.005802BR5920DOCE%20ENCANTO6009SAO%20PAULO62070503%2A%2A%2A6304ABCD" alt="QR Code para pagamento via PIX">
                <div class="pix-info">
                    <label class="copy-label" for="pix-code">Código PIX copia e cola</label>
                    <textarea class="code-box" id="pix-code" rows="6" readonly>00020126580014BR.GOV.BCB.PIX0136doce.encanto@exemplo.com520400005303986540510.005802BR5920DOCE ENCANTO6009SAO PAULO62070503***6304ABCD</textarea>
                    <button class="copy-btn" id="copy-pix" type="button">Copiar código</button>
                </div>
            </div>
            <p class="notice">Após o pagamento, envie o comprovante pelo canal de atendimento para confirmarmos seu pedido.</p>
            <a class="back-link" href="index.html">← Voltar para a doceria</a>
        </section>
    </main>
    <script>
        document.getElementById('copy-pix').addEventListener('click', async function () {
            const code = document.getElementById('pix-code');
            try {
                if (navigator.clipboard) {
                    await navigator.clipboard.writeText(code.value);
                } else {
                    code.select();
                    document.execCommand('copy');
                }
                this.textContent = 'Código copiado!';
            } catch (error) {
                code.select();
                this.textContent = 'Selecione e copie o código';
            }
        });
    </script>
</body>
</html>
