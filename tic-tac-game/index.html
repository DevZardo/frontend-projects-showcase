<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Velha</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h1>Jogo da Velha</h1>
  <div id="buttons-container">
    <button id="2-players">2 Jogadores</button>
    <button id="ai-player">Contra IA</button>
  </div>

  <div id="container" class="hide">
    <div class="board" role="grid" aria-label="Tabuleiro do jogo da velha">
      <div class="box" id="block-1" data-index="1"></div>
      <div class="box" id="block-2" data-index="2"></div>
      <div class="box" id="block-3" data-index="3"></div>
      <div class="box" id="block-4" data-index="4"></div>
      <div class="box" id="block-5" data-index="5"></div>
      <div class="box" id="block-6" data-index="6"></div>
      <div class="box" id="block-7" data-index="7"></div>
      <div class="box" id="block-8" data-index="8"></div>
      <div class="box" id="block-9" data-index="9"></div>
    </div>

    <div id="scoreboard-container">
      <h2>Placar:</h2>
      <div class="score-row">
        <span class="score-box"><strong>X</strong>: <span id="scoreboard-1">0</span></span>
        <span class="score-box"><strong>O</strong>: <span id="scoreboard-2">0</span></span>
      </div>
    </div>
  </div>

  <div id="message" class="hide" role="status" aria-live="polite">
    <p id="message-text"></p>
  </div>

  <script src="js/scripts.js"></script>
</body>
</html>
